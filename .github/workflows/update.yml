name: Update deals

# Re-reads every provider's public pricing page, rebuilds the static site, and
# commits whatever changed. Public repository, so GitHub-hosted runner minutes
# are not billed — which is why this can afford to run every 6 hours.
#
# The schedule is deliberately off the hour (:17) so it does not queue behind the
# thousands of jobs that all fire at :00.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually?"
        required: false
        default: "manual run"

# Needed so the job can push the refreshed data back to the repository.
permissions:
  contents: write

# Never let two refreshes overlap; let a running one finish rather than abort it
# mid-commit.
concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Cloudflare credentials are lifted into job-level env on purpose. The
    # `secrets` context is NOT available inside a step-level `if:`, so writing
    # `if: ${{ secrets.X != '' }}` evaluates the secret as empty and the deploy
    # step is skipped forever, with a green build and no error to explain it.
    # The `env` context *is* available in `if:`, so route through it.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the version this pipeline is actually developed and tested
          # against. Do not lower this to match some idea of "conservative" —
          # every extraction test and every gate run so far happened on 3.13, so
          # a 3.12 runner would be an untested environment on first contact.
          python-version: "3.13"

      # The pipeline is pure standard library on purpose: nothing to install,
      # nothing to pin, no supply chain to audit, no runtime API key.
      - name: Show pipeline config
        run: sed -n '1,24p' .ilang/site.ilang

      - name: Scrape public pricing pages
        run: python scraper.py

      - name: Build static site
        run: python build.py

      # Gate. If the generated markup is malformed — unparsable JSON-LD, a
      # missing canonical, a price that is not a clean decimal, a page left
      # referencing an undefined value — the job fails here and nothing is
      # committed. An auto-publishing site needs a check it cannot talk its way
      # past.
      #
      # It also acts as a circuit breaker: if the priced-provider count collapses
      # by more than 40% in a single run, that is far more likely to be a blocked
      # or rate-limited crawl than a dozen companies changing their pages at once.
      # The job fails, the previous good commit stays live, and no degraded site
      # is published unattended.
      - name: Validate generated site
        run: python verify.py

      - name: Commit refreshed data and site
        run: |
          git config user.name "promo-radar-bot"
          git config user.email "promo-radar-bot@users.noreply.github.com"
          # data/page_state.json is committed on purpose: it is what lets the
          # next run distinguish "page changed" from "page merely re-fetched",
          # which is what makes sitemap lastmod meaningful.
          git add -A data site
          if git diff --cached --quiet; then
            echo "Nothing changed this run — no commit made."
            exit 0
          fi
          # Two different counts, and the message must not conflate them:
          #   providers_with_price_shown — records that carry a number, i.e.
          #     what the site actually publishes (includes a price carried
          #     forward from an earlier run and labelled stale);
          #   providers_with_price — pages that yielded a price *this* run,
          #     which is what the circuit breaker above is calibrated on.
          MSG=$(python -c 'import json;d=json.load(open("data/offers.json",encoding="utf-8"));print("%d/%d providers priced (%d read fresh this run)" % (d["providers_with_price_shown"], d["providers_configured"], d["providers_with_price"]))')
          git commit -m "data: refresh ${MSG} at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "Committed: ${MSG}"

      # Optional. Only runs once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
      # are set as repository secrets. If you instead connected this repository
      # to Cloudflare Pages through the dashboard ("Connect to Git", build
      # command `python build.py`, output directory `site`), Cloudflare rebuilds
      # on the commit above and this step is redundant — it is kept so the site
      # can also be published without any dashboard wiring.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name=vps-deals-radar
            --branch=main
